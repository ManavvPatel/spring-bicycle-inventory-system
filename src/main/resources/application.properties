spring.application.name=trentbicycleshop
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/TrentBicycleShopDB?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:trent}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.thymeleaf.cache=true
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.bootstrap.username=${BOOTSTRAP_USERNAME:owner}
app.bootstrap.password=${BOOTSTRAP_PASSWORD:}
