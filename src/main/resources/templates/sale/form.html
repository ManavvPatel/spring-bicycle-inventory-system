<!doctype html>
<html
  lang="en"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Record sale · Trent Bicycle Shop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="page-heading">
        <div>
          <p class="eyebrow">SALES</p>
          <h1>Record a sale</h1>
          <p>Choose a customer and the products they are taking home.</p>
        </div>
      </div>
      <section class="panel" style="max-width: 800px">
        <form th:action="@{/sales/save}" method="post" th:object="${sale}">
          <div class="form-group">
            <label for="customer">Customer</label
            ><select
              class="form-control"
              id="customer"
              th:field="*{customer.customerID}"
              required
            >
              <option value="">Choose a customer</option>
              <option
                th:each="item : ${customers}"
                th:value="${item.customerID}"
                th:text="${item.firstName + ' ' + item.lastName}"
              ></option>
            </select>
            <p class="form-note">
              Missing a customer?
              <a th:href="@{/customers/add}">Add one first →</a>
            </p>
          </div>
          <h3>Products</h3>
          <p class="form-note">
            Select each product and enter a whole-number quantity. Prices are
            calculated from the product catalogue.
          </p>
          <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
            No products yet.
            <a th:href="@{/products/add}">Create a product first.</a>
          </div>
          <div class="product-line" th:each="product : ${products}">
            <div>
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="productIds"
                  th:value="${product.productID}"
                  th:id="${'product-' + product.productID}"
                  th:checked="${selectedProducts != null and #lists.contains(selectedProducts,product.productID)}"
                /><label
                  th:for="${'product-' + product.productID}"
                  th:text="${product.productName}"
                ></label>
              </div>
              <small
                th:text="${'CA$' + #numbers.formatDecimal(product.unitPrice,1,'COMMA',2,'POINT')}"
              ></small>
            </div>
            <div>
              <label th:for="${'quantity-' + product.productID}">Quantity</label
              ><input
                class="form-control"
                type="number"
                min="1"
                max="2147483647"
                step="1"
                th:id="${'quantity-' + product.productID}"
                th:name="${'quantities[' + product.productID + ']'}"
                th:value="${quantities != null ? quantities['quantities[' + product.productID + ']'] : 1}"
              />
            </div>
          </div>
          <div class="actions mt-4">
            <button class="btn btn-primary" type="submit">Complete sale</button
            ><a class="btn btn-link" th:href="@{/sales}">Cancel</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
