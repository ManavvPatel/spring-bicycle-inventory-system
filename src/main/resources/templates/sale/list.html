<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Sales List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2 class="text-center mb-4">Sales List</h2>
          <div class="toolbar">
            <div class="table-search">
              <label for="search-0">Search this table</label
              ><input
                id="search-0"
                type="search"
                class="form-control"
                data-table-search="records-0"
                placeholder="Search records…"
              />
            </div>
            <span
              class="table-count"
              data-count-for="records-0"
              aria-live="polite"
            ></span>
          </div>
          <div class="table-wrap">
            <table id="records-0" class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Sales ID</th>
                  <th>Customer</th>
                  <th>Sale Date</th>
                  <th>Total Amount</th>
                </tr>
              </thead>
              <tbody>
                <tr data-row th:each="sale : ${sales}">
                  <td th:text="${sale.salesID}"></td>
                  <td
                    th:text="${sale.customer.firstName + ' ' + sale.customer.lastName}"
                  ></td>
                  <td
                    th:text="${sale.saleDate != null ? #temporals.format(sale.saleDate, 'MMM d, yyyy · HH:mm') : '—'}"
                  ></td>
                  <td
                    th:text="${'CA$' + #numbers.formatDecimal(sale.totalAmount, 1, 'COMMA', 2, 'POINT')}"
                  ></td>
                </tr>
                <tr th:if="${#lists.isEmpty(sales)}">
                  <td colspan="4" class="empty-state">
                    <strong>No records yet</strong>Add a record to get started.
                  </td>
                </tr>
                <tr data-no-results hidden>
                  <td colspan="4" class="empty-state">
                    No matching records. Try another search.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="text-center">
            <a th:href="@{/sales/add}" class="btn btn-primary"
              >Record a New Sale</a
            >
          </div>
          <div class="text-center mt-3">
            <a th:href="@{/}" class="btn btn-link back-link">Back to Home</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
