<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>User Management</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container mt-4">
        <h2>User Management</h2>
        <div class="toolbar">
          <div class="table-search">
            <label for="search-0">Search this table</label
            ><input
              id="search-0"
              type="search"
              class="form-control"
              data-table-search="records-0"
              placeholder="Search records…"
            />
          </div>
          <span
            class="table-count"
            data-count-for="records-0"
            aria-live="polite"
          ></span>
        </div>
        <div class="table-wrap">
          <table id="records-0" class="table table-striped">
            <thead>
              <tr>
                <th>UserID</th>
                <th>Username</th>
                <th>Role</th>
                <th>CreatedAt</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr data-row th:each="user : ${users}">
                <td th:text="${user.userID}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.role}"></td>
                <td
                  th:text="${user.createdAt != null ? #temporals.format(user.createdAt, 'MMM d, yyyy · HH:mm') : '—'}"
                ></td>
                <td>
                  <form
                    th:action="@{'/admin/users/delete/' + ${user.userID}}"
                    method="post"
                    class="inline-form"
                    data-confirm="Delete this record? Linked records cannot be deleted."
                  >
                    <button class="btn btn-sm btn-danger" type="submit">
                      Delete
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="5" class="empty-state">
                  <strong>No records yet</strong>Add a record to get started.
                </td>
              </tr>
              <tr data-no-results hidden>
                <td colspan="5" class="empty-state">
                  No matching records. Try another search.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <a href="/admin/users/add" class="btn btn-primary">Add New User</a>
      </div>
    </main>
  </body>
</html>
