<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Orders</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2 class="text-center mb-4">Orders</h2>
          <div class="toolbar">
            <div class="table-search">
              <label for="search-0">Search this table</label
              ><input
                id="search-0"
                type="search"
                class="form-control"
                data-table-search="records-0"
                placeholder="Search records…"
              />
            </div>
            <span
              class="table-count"
              data-count-for="records-0"
              aria-live="polite"
            ></span>
          </div>
          <div class="table-wrap">
            <table id="records-0" class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Supplier</th>
                  <th>Status</th>
                  <th>Order Date</th>
                  <th>Update Status</th>
                </tr>
              </thead>
              <tbody>
                <tr data-row th:each="order : ${orders}">
                  <td th:text="${order.orderID}"></td>
                  <td
                    th:text="${order.supplier != null ? order.supplier.supplierName : '—'}"
                  ></td>
                  <td
                    th:text="${order.status != null ? order.status.statusName : 'Unknown'}"
                  ></td>
                  <td
                    th:text="${order.orderDate != null ? #temporals.format(order.orderDate, 'MMM d, yyyy · HH:mm') : '—'}"
                  ></td>
                  <td>
                    <span
                      class="badge neutral"
                      th:if="${order.status != null and order.status.statusName != 'Shipped'}"
                      >Complete</span
                    >
                    <form
                      th:if="${order.status != null and order.status.statusName == 'Shipped'}"
                      th:action="@{/orders/updateStatus}"
                      method="post"
                    >
                      <input
                        type="hidden"
                        name="orderID"
                        th:value="${order.orderID}"
                      />
                      <select
                        name="statusID"
                        aria-label="Order status"
                        class="form-control form-control-sm"
                        required
                      >
                        <option
                          value=""
                          disabled
                          th:if="${order.status == null}"
                        >
                          Select Status
                        </option>
                        <option
                          th:each="status : ${orderStatuses}"
                          th:value="${status.statusID}"
                          th:text="${status.statusName}"
                          th:selected="${order.status != null and order.status.statusID == status.statusID}"
                        ></option>
                      </select>
                      <button type="submit" class="btn btn-sm btn-custom mt-2">
                        Update
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(orders)}">
                  <td colspan="5" class="empty-state">
                    <strong>No records yet</strong>Add a record to get started.
                  </td>
                </tr>
                <tr data-no-results hidden>
                  <td colspan="5" class="empty-state">
                    No matching records. Try another search.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="text-center">
            <a th:href="@{/orders/add}" class="btn btn-primary"
              >Add Another Order</a
            >
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
