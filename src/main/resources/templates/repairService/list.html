<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Repair Services List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2 class="mb-4 text-center">Repair Services</h2>
          <div class="text-center mb-3">
            <a th:href="@{/repairServices/add}" class="btn btn-primary"
              >Add New Repair Service</a
            >
          </div>
          <div class="toolbar">
            <div class="table-search">
              <label for="search-0">Search this table</label
              ><input
                id="search-0"
                type="search"
                class="form-control"
                data-table-search="records-0"
                placeholder="Search records…"
              />
            </div>
            <span
              class="table-count"
              data-count-for="records-0"
              aria-live="polite"
            ></span>
          </div>
          <div class="table-wrap">
            <table id="records-0" class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Service ID</th>
                  <th>Service Name</th>
                  <th>Description</th>
                  <th>Cost</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr data-row th:each="service : ${services}">
                  <td th:text="${service.serviceID}"></td>
                  <td th:text="${service.serviceName}"></td>
                  <td th:text="${service.description}"></td>
                  <td
                    th:text="${'CA$' + #numbers.formatDecimal(service.cost, 1, 'COMMA', 2, 'POINT')}"
                  ></td>
                  <td>
                    <a
                      th:href="@{'/repairServices/edit/' + ${service.serviceID}}"
                      class="btn btn-sm btn-custom"
                      >Edit</a
                    >
                    <form
                      th:action="@{'/repairServices/delete/' + ${service.serviceID}}"
                      method="post"
                      class="inline-form"
                      data-confirm="Delete this record? Linked records cannot be deleted."
                    >
                      <button type="submit" class="btn btn-sm btn-danger">
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(services)}">
                  <td colspan="5" class="empty-state">
                    <strong>No records yet</strong>Add a record to get started.
                  </td>
                </tr>
                <tr data-no-results hidden>
                  <td colspan="5" class="empty-state">
                    No matching records. Try another search.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="text-center">
            <a th:href="@{/}" class="btn btn-link back-link">Back to Home</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
