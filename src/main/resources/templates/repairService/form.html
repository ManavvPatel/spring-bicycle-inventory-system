<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title
      th:text="${service.serviceID == null ? 'Add New Repair Service' : 'Edit Repair Service'}"
    >
      Repair Service Form
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2
            th:text="${service.serviceID == null ? 'Add New Repair Service' : 'Edit Repair Service'}"
          ></h2>
          <form
            th:action="@{/repairServices/save}"
            th:object="${service}"
            method="post"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <input type="hidden" th:field="*{serviceID}" />
            <div class="form-group">
              <label for="serviceName">Service Name:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{serviceName}"
                id="serviceName"
                placeholder="Enter service name"
                required
              />
            </div>
            <div class="form-group">
              <label for="description">Description:</label>
              <textarea
                class="form-control"
                th:field="*{description}"
                id="description"
                placeholder="Enter description"
              ></textarea>
            </div>
            <div class="form-group">
              <label for="cost">Cost:</label>
              <input
                type="number"
                step="0.01"
                min="0"
                class="form-control"
                th:field="*{cost}"
                id="cost"
                placeholder="Enter cost"
                required
              />
            </div>
            <button type="submit" class="btn btn-custom btn-block">
              Save Service
            </button>
          </form>
          <a th:href="@{/repairServices}" class="btn btn-link back-link"
            >Back to Services List</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
