<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Add Inventory</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2>Add Inventory</h2>
          <form
            th:action="@{/inventory/save}"
            th:object="${inventory}"
            method="post"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <input type="hidden" th:field="*{inventoryID}" />
            <div class="form-group">
              <label for="product">Product:</label>
              <select class="form-control" th:field="*{product}" required>
                <option value="" disabled selected>Select Product</option>
                <option
                  th:each="product : ${products}"
                  th:value="${product}"
                  th:text="${product.productName}"
                ></option>
              </select>
            </div>
            <div class="form-group">
              <label for="currentStock">Stock:</label>
              <input
                type="number"
                class="form-control"
                th:field="*{currentStock}"
                id="currentStock"
                required
              />
            </div>
            <button type="submit" class="btn btn-custom btn-block">Save</button>
          </form>
          <a th:href="@{/inventory}" class="btn btn-link back-link"
            >Back to Inventory</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
