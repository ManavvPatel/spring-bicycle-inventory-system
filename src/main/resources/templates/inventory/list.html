<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Inventory List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2 class="mb-4 text-center">Inventory List</h2>
          <div class="toolbar">
            <div class="table-search">
              <label for="search-0">Search this table</label
              ><input
                id="search-0"
                type="search"
                class="form-control"
                data-table-search="records-0"
                placeholder="Search records…"
              />
            </div>
            <span
              class="table-count"
              data-count-for="records-0"
              aria-live="polite"
            ></span>
          </div>
          <div class="table-wrap">
            <table id="records-0" class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Current Stock</th>
                  <th>Status</th>
                  <th>Last Update</th>
                </tr>
              </thead>
              <tbody>
                <tr data-row th:each="inv : ${inventoryList}">
                  <td th:text="${inv.product.productName}">Product Name</td>
                  <td th:text="${inv.currentStock}">0</td>
                  <td>
                    <span
                      class="badge"
                      th:classappend="${inv.currentStock == null or inv.currentStock == 0} ? 'danger' : (${inv.currentStock &lt;= 5} ? 'warning' : '')"
                      th:text="${inv.currentStock == null or inv.currentStock == 0} ? 'Out of stock' : (${inv.currentStock &lt;= 5} ? 'Low stock' : 'In stock')"
                    ></span>
                  </td>
                  <td
                    th:text="${inv.lastUpdate != null ? #temporals.format(inv.lastUpdate, 'MMM d, yyyy · HH:mm') : '—'}"
                  >
                    N/A
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(inventoryList)}">
                  <td colspan="4" class="empty-state">
                    <strong>No records yet</strong>Add a record to get started.
                  </td>
                </tr>
                <tr data-no-results hidden>
                  <td colspan="4" class="empty-state">
                    No matching records. Try another search.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <a th:href="@{/}" class="btn btn-link back-link">Back to Home</a>
        </div>
      </div>
    </main>
  </body>
</html>
