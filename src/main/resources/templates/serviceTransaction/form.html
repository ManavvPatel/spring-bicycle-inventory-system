<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Initiate Service Transaction</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2>Initiate Service Transaction</h2>
          <form
            th:action="@{/serviceTransactions/save}"
            method="post"
            th:object="${transaction}"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <div class="form-group">
              <label for="customer">Customer:</label>
              <select
                class="form-control"
                th:field="*{customer.customerID}"
                id="customer"
                required
              >
                <option value="">--Select Customer--</option>
                <option
                  th:each="cust : ${customers}"
                  th:value="${cust.customerID}"
                  th:text="${cust.firstName + ' ' + cust.lastName}"
                ></option>
              </select>
            </div>
            <div class="form-group">
              <label for="repairService">Service:</label>
              <select
                class="form-control"
                th:field="*{repairService.serviceID}"
                id="repairService"
                required
              >
                <option value="">--Select Service--</option>
                <option
                  th:each="service : ${repairServices}"
                  th:value="${service.serviceID}"
                  th:text="${service.serviceName}"
                ></option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Submit Transaction
            </button>
          </form>
          <a th:href="@{/serviceTransactions}" class="btn btn-link back-link"
            >Back to Transactions List</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
