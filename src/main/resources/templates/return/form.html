<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Record a Return</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2>Record a Return</h2>
          <form
            th:action="@{/returns/save}"
            method="post"
            th:object="${aReturn}"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <div class="form-group">
              <label for="sale">Sale:</label>
              <select
                class="form-control"
                th:field="*{sale.salesID}"
                id="sale"
                required
              >
                <option value="">--Select Sale--</option>
                <option
                  th:each="sale : ${sales}"
                  th:value="${sale.salesID}"
                  th:text="${'Sale ' + sale.salesID + ' - ' + sale.customer.firstName + ' ' + sale.customer.lastName}"
                ></option>
              </select>
            </div>
            <div class="form-group">
              <label for="product">Product Returned:</label>
              <select
                class="form-control"
                th:field="*{product.productID}"
                id="product"
                required
              >
                <option value="">--Select Product--</option>
                <option
                  th:each="product : ${products}"
                  th:value="${product.productID}"
                  th:text="${product.productName}"
                  th:data-unitprice="${product.unitPrice}"
                ></option>
              </select>
            </div>
            <p class="form-note">
              Each return records one unit. The refund is calculated from the
              original sale price, and the unit is added back to stock. Select
              only a product included in that sale.
            </p>
            <button type="submit" class="btn btn-primary btn-block">
              Submit Return
            </button>
          </form>
          <a th:href="@{/returns}" class="btn btn-link back-link"
            >Back to Returns List</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
