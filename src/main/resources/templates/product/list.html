<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Product List</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2 class="text-center mb-4">Product List</h2>
          <div class="text-center mb-3">
            <a th:href="@{/products/add}" class="btn btn-primary"
              >Add New Product</a
            >
          </div>
          <div class="toolbar">
            <div class="table-search">
              <label for="search-0">Search this table</label
              ><input
                id="search-0"
                type="search"
                class="form-control"
                data-table-search="records-0"
                placeholder="Search records…"
              />
            </div>
            <span
              class="table-count"
              data-count-for="records-0"
              aria-live="polite"
            ></span>
          </div>
          <div class="table-wrap">
            <table id="records-0" class="table table-bordered table-striped">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Brand</th>
                  <th>Category</th>
                  <th>Unit Price</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr data-row th:each="product : ${products}">
                  <td th:text="${product.productName}"></td>
                  <td th:text="${product.brand}"></td>
                  <td
                    th:text="${product.categoryID != null ? (categoryNames[product.categoryID] ?: 'Uncategorized') : 'Uncategorized'}"
                  ></td>
                  <td
                    th:text="${'CA$' + #numbers.formatDecimal(product.unitPrice, 1, 'COMMA', 2, 'POINT')}"
                  ></td>
                  <td>
                    <a
                      th:href="@{'/products/edit/' + ${product.productID}}"
                      class="btn btn-sm btn-primary"
                      >Edit</a
                    >
                    <form
                      th:action="@{'/products/delete/' + ${product.productID}}"
                      method="post"
                      class="inline-form"
                      data-confirm="Delete this record? Linked records cannot be deleted."
                    >
                      <button type="submit" class="btn btn-sm btn-danger">
                        Delete
                      </button>
                    </form>
                  </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                  <td colspan="5" class="empty-state">
                    <strong>No records yet</strong>Add a record to get started.
                  </td>
                </tr>
                <tr data-no-results hidden>
                  <td colspan="5" class="empty-state">
                    No matching records. Try another search.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <a th:href="@{/}" class="btn btn-link back-link">Back to Home</a>
        </div>
      </div>
    </main>
  </body>
</html>
