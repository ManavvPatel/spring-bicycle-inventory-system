<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title
      th:text="${product.productID == null ? 'Add Product' : 'Edit Product'}"
    >
      Product Form
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2
            th:text="${product.productID == null ? 'Add Product' : 'Edit Product'}"
          ></h2>
          <form
            th:action="@{/products/save}"
            th:object="${product}"
            method="post"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <input type="hidden" th:field="*{productID}" />
            <div class="form-group">
              <label for="productName">Name:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{productName}"
                id="productName"
                required
              />
            </div>
            <div class="form-group">
              <label for="brand">Brand:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{brand}"
                id="brand"
              />
            </div>
            <div class="form-group">
              <label for="categoryID">Category:</label>
              <select class="form-control" th:field="*{categoryID}">
                <option value="">-- Select Category --</option>
                <option
                  th:each="cat : ${categories}"
                  th:value="${cat.categoryID}"
                  th:text="${cat.categoryName}"
                ></option>
              </select>
            </div>
            <div class="form-group">
              <label for="unitPrice">Unit Price:</label>
              <input
                type="number"
                step="0.01"
                min="0"
                class="form-control"
                th:field="*{unitPrice}"
                id="unitPrice"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Save
            </button>
          </form>
          <a th:href="@{/products}" class="btn btn-link back-link"
            >Back to Product List</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
