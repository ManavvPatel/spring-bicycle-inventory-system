<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title
      th:text="${customer.customerID == null ? 'Add Customer' : 'Edit Customer'}"
    >
      Customer Form
    </title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script defer th:src="@{/js/app.js}"></script>
  </head>
  <body>
    <div th:replace="~{fragments/layout :: shell}"></div>
    <main id="main-content" class="workspace form-page">
      <div th:replace="~{fragments/layout :: notices}"></div>
      <div class="container">
        <div class="card">
          <h2
            th:text="${customer.customerID == null ? 'Add Customer' : 'Edit Customer'}"
          ></h2>
          <form
            th:action="@{/customers/save}"
            th:object="${customer}"
            method="post"
          >
            <div
              th:if="${#fields.hasAnyErrors()}"
              class="alert alert-danger"
              role="alert"
            >
              <p>Please correct the fields below.</p>
              <ul>
                <li
                  th:each="err : ${#fields.allErrors()}"
                  th:text="${err}"
                ></li>
              </ul>
            </div>
            <input type="hidden" th:field="*{customerID}" />
            <div class="form-group">
              <label for="firstName">First Name:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{firstName}"
                id="firstName"
                placeholder="Enter first name"
                required
              />
            </div>
            <div class="form-group">
              <label for="lastName">Last Name:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{lastName}"
                id="lastName"
                placeholder="Enter last name"
                required
              />
            </div>
            <div class="form-group">
              <label for="phone">Phone:</label>
              <input
                type="text"
                class="form-control"
                th:field="*{phone}"
                id="phone"
                placeholder="Enter phone number"
              />
            </div>
            <div class="form-group">
              <label for="email">Email:</label>
              <input
                type="email"
                class="form-control"
                th:field="*{email}"
                id="email"
                placeholder="Enter email"
                required
              />
            </div>
            <button type="submit" class="btn btn-custom btn-block">Save</button>
          </form>
          <a th:href="@{/customers}" class="btn btn-link back-link"
            >Back to Customer List</a
          >
        </div>
      </div>
    </main>
  </body>
</html>
